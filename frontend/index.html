<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KubeAuth - OIDC Kubernetes RBAC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="d-flex" id="wrapper">
  <!-- Sidebar -->
  <aside class="sidebar bg-dark text-white p-3">
    <div class="d-flex align-items-center mb-4">
      <i class="bi bi-shield-shaded text-primary fs-3 me-2"></i>
      <span class="fs-4 fw-bold">KubeAuth</span>
    </div>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a href="#" class="nav-link active"><i class="bi bi-people-fill me-2"></i> Developer RBAC</a>
      </li>
      <li>
        <a href="#" class="nav-link text-white-50"><i class="bi bi-box-seam me-2"></i> Namespaces</a>
      </li>
      <li>
        <a href="http://localhost:8080/admin" target="_blank" class="nav-link text-white-50">
          <i class="bi bi-box-arrow-up-right me-2"></i> Keycloak Console
        </a>
      </li>
    </ul>
    <hr class="border-secondary">
    <div class="small">
      <div class="text-secondary">Connected Realm:</div>
      <div class="fw-bold text-success"><i class="bi bi-record-fill"></i> k8s-realm</div>
    </div>
  </aside>

  <!-- Page Content -->
  <main class="page-content flex-grow-1 p-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h2 class="fw-bold mb-1">Developer Role Bindings</h2>
        <p class="text-muted mb-0">Map Keycloak identities to Kubernetes namespace roles</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#assignModal">
        <i class="bi bi-plus-lg me-1"></i> Assign Developer Access
      </button>
    </div>

    <!-- Alert Banner -->
    <div id="statusAlert" class="alert alert-info d-none" role="alert"></div>

    <!-- Table Card -->
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold">Active RoleBindings</h5>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadAll()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-4">RoleBinding</th>
                <th>User (Keycloak Subject)</th>
                <th>Target Namespace</th>
                <th>ClusterRole</th>
                <th class="text-end pe-4">Actions</th>
              </tr>
            </thead>
            <tbody id="bindingsTable">
              <!-- Dynamically rendered -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal: Assign Developer Access -->
<div class="modal fade" id="assignModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Grant Namespace Permissions</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="assignForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Select Keycloak User</label>
            <select class="form-select" id="userSelect" required>
              <option value="">Loading users...</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Target Kubernetes Namespace</label>
            <select class="form-select" id="namespaceSelect" required>
              <option value="">Loading namespaces...</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">ClusterRole Access Level</label>
            <select class="form-select" id="roleSelect" required>
              <option value="edit">edit (Developer: deploy pods, services, logs, exec)</option>
              <option value="view">view (Viewer: read-only access to resources)</option>
              <option value="admin">admin (Namespace Owner: full rights inside namespace)</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btnSubmit">Create RoleBinding</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
